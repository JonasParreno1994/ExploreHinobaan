<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f97316" />
        <title>Offline - Explore Hinoba-an</title>
        <style>
            :root {
                color: #0f172a;
                background: #fffbf5;
                font-family: system-ui, sans-serif;
            }
            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                place-items: center;
            }
            main {
                box-sizing: border-box;
                width: min(28rem, calc(100% - 2rem));
                padding: 2rem;
                border: 1px solid #fed7aa;
                border-radius: 1.5rem;
                background: #fff;
                box-shadow: 0 20px 45px rgb(15 23 42 / 12%);
                text-align: center;
            }
            img {
                width: 5rem;
                height: 5rem;
            }
            h1 {
                margin: 1rem 0 0.5rem;
                font-size: 1.75rem;
            }
            p {
                margin: 0;
                color: #475569;
                line-height: 1.6;
            }
            button {
                width: 100%;
                margin-top: 1.5rem;
                padding: 0.8rem 1rem;
                border: 0;
                border-radius: 0.75rem;
                color: #fff;
                background: #ea580c;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>You're offline</h1>
            <p>Reconnect to the internet to continue exploring Hinoba-an.</p>
            <button type="button" onclick="window.location.reload()">Try again</button>
        </main>
    </body>
</html>
